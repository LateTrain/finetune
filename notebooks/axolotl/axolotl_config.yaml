base_model: meta-llama/Llama-3.2-3B-Instruct
model_type: LlamaForCausalLM
tokenizer_type: AutoTokenizer

load_in_4bit: true
strict: false

datasets:
  - path: cyber_defense_qa.jsonl
    type: alpaca  # maps {instruction, response} -> prompt/response fields
    field_instruction: instruction
    field_output: response

val_set_size: 0.1
output_dir: ./trinity-axolotl-lora

adapter: lora
lora_r: 16
lora_alpha: 16
lora_dropout: 0.05
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj

sequence_len: 2048
sample_packing: false
pad_to_sequence_len: true

gradient_accumulation_steps: 4
micro_batch_size: 2
num_epochs: 3
optimizer: adamw_bnb_8bit
lr_scheduler: cosine
learning_rate: 0.0002

bf16: auto
tf32: true

gradient_checkpointing: true
logging_steps: 5
warmup_steps: 5

special_tokens:
  pad_token: "<|end_of_text|>"
