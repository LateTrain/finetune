<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Trinity | Cyber Defense Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div id="app">
    <header id="app-header">
      <span class="logo">&#9737;</span>
      <div>
        <h1>Trinity</h1>
        <p class="subtitle">Cyber Defense Assistant</p>
      </div>
    </header>
    <div id="chat-log"></div>
    <form id="chat-form">
      <input id="chat-input" type="text" placeholder="Ask Trinity about a threat, vuln, or defense strategy..." autocomplete="off" />
      <button type="submit">Send</button>
    </form>
  </div>
  <script src="/static/chat.js"></script>
</body>
</html>
